name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ansible and ansible-lint
        run: pip install ansible-core==2.21.4 ansible-lint==26.9.0
      - name: Install collections
        run: ansible-galaxy collection install -r tests/requirements.yml
      - name: ansible-lint (production profile)
        run: ansible-lint --profile production

  # The runner is a throwaway VM with systemd: deploy for real, deploy again (must
  # change nothing), then initialize, unseal and take a snapshot.
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ansible
        run: pip install ansible-core==2.21.4
      - name: Install collections
        run: ansible-galaxy collection install -r tests/requirements.yml
      - name: Deploy
        run: ansible-playbook -i localhost, -c local tests/test.yml
      - name: Deploy again (idempotence)
        run: |
          ansible-playbook -i localhost, -c local tests/test.yml | tee second.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' second.log
      - name: Check mode on a deployed host changes nothing
        run: |
          ansible-playbook -i localhost, -c local tests/test.yml --check | tee check.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' check.log
      - name: Initialize, unseal, snapshot
        run: sudo tests/verify.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
