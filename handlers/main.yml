---
- name: Reload vault
  ansible.builtin.systemd_service:
    name: vault
    state: reloaded
  when: vault_service_enabled | bool

- name: Remind to restart vault
  ansible.builtin.debug:
    msg: >-
      /etc/vault.d/vault.hcl changed. Vault keeps the old config until
      `sudo systemctl restart vault` + unseal.

- name: Remind that the new version needs a restart
  ansible.builtin.debug:
    msg: >-
      Vault {{ vault_version }} is installed but the running server keeps the old
      version until `sudo systemctl restart vault` + unseal (README "Upgrade").
